name: Deep Research Pass

on:
  schedule:
    # Once a day at 02:00 UTC (~7:30 AM IST). Separate from the RSS scan since this
    # one burns real search-API budget (Tavily free tier: 1,000 queries/month, no card).
    - cron: "0 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: research-radar-deep
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deep-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deep research
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          cd src
          python deep_research.py
          python generate_report.py

      - name: Commit and push results
        run: |
          git config user.name "research-radar-bot"
          git config user.email "actions@github.com"
          git add research/
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Deep research update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, pulling latest and retrying ($i)..."
            git pull --rebase origin main
          done
          echo "Push failed after retries."
          exit 1
