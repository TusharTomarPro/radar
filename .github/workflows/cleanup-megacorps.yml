name: Cleanup Megacorps (manual)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cleanup
        run: |
          cd src
          python cleanup_megacorps.py

      - name: Commit and push results
        run: |
          git config user.name "research-radar-bot"
          git config user.email "actions@github.com"
          git add research/
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Cleanup: remove megacorp entries"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, pulling latest and retrying ($i)..."
            git pull --rebase origin main
          done
          echo "Push failed after retries."
          exit 1
